<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="56" height="56">
  <defs>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)" transform="rotate(90, 256, 256)">
    <!-- Cab -->
    <rect x="180" y="40" width="152" height="100" rx="10" fill="#e67e22" stroke="white" stroke-width="2"/>
    <!-- Trailer -->
    <rect x="160" y="160" width="192" height="300" rx="5" fill="#d35400" stroke="white" stroke-width="4"/>
    <!-- Connection -->
    <rect x="240" y="140" width="32" height="20" fill="#7f8c8d"/>
    <!-- Windshield -->
    <rect x="190" y="50" width="132" height="40" fill="#34495e"/>
  </g>
</svg>
