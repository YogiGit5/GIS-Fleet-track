<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="64" height="64">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Cab -->
    <path fill="#e74c3c" stroke="white" stroke-width="2" d="M380 180h-40v-50h-40v50H60v160h20v40h50v-40h200v40h50v-40h20v-80l-40-30z"/>
    <!-- Container -->
    <rect x="50" y="80" width="260" height="150" fill="#3498db" stroke="white" stroke-width="4"/>
    <path fill="none" stroke="white" stroke-width="2" d="M100 80v150 M150 80v150 M200 80v150 M250 80v150"/>
  </g>
</svg>
